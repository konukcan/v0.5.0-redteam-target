<!DOCTYPE html>
<html>
    <head>
        <title> Experiment </title>

        <link rel="stylesheet" href='css/jspsych.css' />
        <link rel="stylesheet" href='css/jquery-ui-edit.css' />

        <script src='js/jquery.min.js'></script>
        <script src='js/jquery-ui.min.js'></script>
        <script src='js/timeme.min.js'></script>

        <!-- Phaser-->
        <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
        <script type="module" src="phaser/src/game.js"></script>
        <script src="vignettes/utils.js"></script>

        <!-- hCaptcha -->
        <script src="https://js.hcaptcha.com/1/api.js" async defer></script>

        <script src='js/jspsych.js'></script>
        <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
        <script src='js/plugin-preload.js'></script>
        <script src='js/plugin-instructions.js'></script>
        <script src='js/plugin-html-button-response.js'></script>
        <script src='js/plugin-survey-multi-choice.js'></script>
        <script src='js/plugin-survey-html-form.js'></script>
        <script src='js/plugin-hierarchy-ranking.js'></script>

        <!-- jsPsych plugins -->
        <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
        <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

        <script src='js/instructions.js'></script>
        <script src="vignettes/scenes.js"></script>
        <script src="vignettes/stories.js"></script>
        <script src='js/plugin-captcha-trial.js'></script>
           <!-- cyborg-hunter (signal collection + triage) and guard
               (deterrence + honeypot detection). Each guard extension
               is self-contained — one script per concern. cyborg-hunter
               splits its core (cyborg-hunter.min.js) from its extension
               adapter so non-jsPsych studies can use the core directly.
               Load order: friction before honeypot, so honeypot's
               subscription to friction events lands cleanly. -->
           <script src='../../dist/cyborg-hunter.min.js'></script>
           <script src='../../dist/extension-cyborg-hunter.js'></script>
           <script src='../../dist/extension-guard-friction.js'></script>
           <script src='../../dist/extension-guard-honeypot.js'></script>

        <script src='js/consent.js'></script>
        <script src='js/feedback-demographics.js'></script>
        <script src='js/utils.js'></script>

        <style>
            .scene-grid {
                display: grid;
                grid-template-columns: auto 1fr 1fr 1fr;
                grid-template-rows: auto auto;
                gap: 6px 10px;
                max-width: 750px;
                margin: 0 auto 10px auto;
                align-items: center;
            }
            .scene-cell .cell-header {
                text-align: center;
                font-weight: bold;
                font-size: 14px;
                color: #555;
                margin-bottom: 4px;
            }
            .scene-grid .row-label {
                font-weight: bold;
                font-size: 14px;
                padding-right: 8px;
                text-align: right;
            }
            .scene-grid .pref-cell {
                grid-row: 1 / 3;
                grid-column: 2;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .scene-img {
                width: 100%;
                max-width: 180px;
                height: auto;
                border-radius: 8px;
                box-shadow: 0 3px 6px rgba(0, 0, 0, 0.18);
                transition: opacity 0.6s ease-in-out, outline 0.3s;
            }
            .scene-img.dimmed {
                opacity: 0.3;
            }
            .scene-img.highlighted {
                outline: 3px solid #1976d2;
                outline-offset: 2px;
            }
            .scene-cell {
                text-align: center;
            }
            .scene-desc {
                font-size: 13px;
                color: #000000;
                margin-top: 4px;
                line-height: 1.3;
                min-height: 2.6em;
                transition: opacity 0.4s ease-in-out;
            }
            .scene-desc.tooltip-mode {
                opacity: 0;
                transition: opacity 0.2s ease-in-out;
            }
            .scene-cell:hover .scene-desc.tooltip-mode {
                opacity: 1;
            }
        </style>

    </head>

    <body>
    </body>

    <script>
        console.log('Loading jsPsych plugins and utils');

        TimeMe.initialize({
            currentPageName: 'page',
            idleTimeoutInSeconds: 15
        });

        // =============================================================
        // EXPERIMENT CONFIGURATION
        // =============================================================

        var debugMode = false;
        // Test mode: append ?test=1 to the URL to skip comprehension and
        // truncate the trial list to 2, so the experiment can be walked
        // end-to-end in ~1 minute. Used for verifying guard wiring and
        // CSV output without sitting through the full study. The
        // window._inspectGuards() helper (defined after initJsPsych) is
        // available regardless of test mode for mid-experiment console
        // inspection.
        var testMode = new URLSearchParams(window.location.search).get('test') === '1';
        // Observe-only mode: append ?observe=1 to the URL to suppress
        // friction's enforcement (no overlay, no content scramble, no
        // fullscreen requirement) while still recording violations to the
        // log. Designed for red-team environments where the agent can't
        // enter fullscreen (e.g. GPT Operator). The honeypot bait
        // surfaces are unaffected — they still get filled by agents that
        // engage with them, and ai_use / ai_report still get recorded.
        var observeMode = new URLSearchParams(window.location.search).get('observe') === '1';
        var skipComprehension = testMode; // Set to false to enable comprehension checks
        const prolific_return_url = "https://app.prolific.com/submissions/complete?cc=CYBS69HT";

        // RFC 4180-style CSV field quoter. Wraps any value in double quotes
        // and escapes embedded quotes by doubling. Use for every string
        // field that originates from URL params, jsPsych data, or
        // participant input — any of which could contain a comma, newline,
        // or quote that would otherwise corrupt the CSV. Numeric/boolean
        // fields can stay raw. (Fix for the CSV-injection finding in PR #1
        // review — URL-derived prolific_id et al. were inserted unquoted.)
        function csvQuote(v) {
            if (v == null) return '""';
            var s = String(v);
            return '"' + s.replace(/"/g, '""') + '"';
        }
        if (testMode) {
            console.log('%c[TEST MODE] Comprehension skipped; trials truncated to 2. ' +
                'Call window._inspectGuards() in the console at any time to dump state.',
                'background: #ffcc00; color: #000; padding: 2px 6px; font-weight: bold;');
        }
        if (observeMode) {
            console.log('%c[OBSERVE MODE] Friction enforcement suppressed (no overlay, no scramble, no fullscreen requirement). ' +
                'Violations still logged. Honeypot bait surfaces unchanged. ' +
                'Use this URL to red-team agents that can\'t enter fullscreen.',
                'background: #1976d2; color: #fff; padding: 2px 6px; font-weight: bold;');
        }

        // Participant + session IDs computed BEFORE initJsPsych so the
        // cyborg-hunter extension can read participantId at initialize()
        // time. Vanilla equivalents of jsPsych.randomization.randomID and
        // jsPsych.data.getURLVariable, which only exist after initJsPsych.
        const unique_id = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).slice(0, 10);
        const prolific_id = new URLSearchParams(window.location.search).get('PROLIFIC_PID') || '';
        const prolific_study_id = new URLSearchParams(window.location.search).get('STUDY_ID') || '';
        const prolific_session_id = new URLSearchParams(window.location.search).get('SESSION_ID') || '';
        // DataPipe experiment ID. Get one at https://pipe.jspsych.org by
        // creating a study tied to your OSF project. If you leave the
        // placeholder, the study falls back to triggering a local CSV
        // download in the browser (works for solo manual tests; will not
        // work for Operator/cloud bots that have no download destination).
        const experiment_id = "GRbZzp3Wb17w";
        const _USING_PLACEHOLDER_DATAPIPE_ID = experiment_id === "REPLACE_WITH_YOUR_DATAPIPE_ID";
        if (_USING_PLACEHOLDER_DATAPIPE_ID) {
            console.warn(
                '%c[study] DataPipe experiment_id is a placeholder.\n' +
                'Data will NOT upload to DataPipe; will fall back to a local CSV download.\n' +
                'To use DataPipe: create a study at https://pipe.jspsych.org and replace ' +
                'REPLACE_WITH_YOUR_DATAPIPE_ID in studies/presentational-goals-status/index.html.',
                'color: #b07000; font-weight: bold;'
            );
        }
        const fileID = prolific_id || unique_id;
        const participant_id = prolific_id || unique_id;

        // =============================================================
        // Initialize jsPsych
        // =============================================================
        const jsPsych = initJsPsych({
            show_progress_bar: true,
            auto_update_progress_bar: false,
            extensions: [
                { type: jsPsychCyborgHunter, params: { participantId: participant_id, preset: 'standard' } },
                // In observe mode, friction starts itself from initialize()
                // (no entry trial needed). In normal mode, friction starts
                // from the entry trial's on_finish after fullscreen succeeds.
                { type: jsPsychGuardFriction, params: { observeOnly: observeMode } },
                { type: jsPsychGuardHoneypot }
            ],
            on_finish: () => {
                // Order matters: stop friction first so its final 'end' event
                // for any in-progress violation reaches the honeypot's log
                // before the honeypot writes the rollup to jsPsych data.
                jsPsych.extensions['guard-friction'].finalize();
                jsPsych.extensions['guard-honeypot'].finalize();
                jsPsych.extensions['cyborg-hunter'].finalize();
                $('#jspsych-content').css('margin-top', 'auto');
                if (testMode) {
                    // Suppress redirect to Prolific so the page sits idle and
                    // the researcher can call _inspectGuards() or grab the
                    // CSV via copy(jsPsych.data.get().csv()) without
                    // racing the navigation.
                    $('#jspsych-content').html('<div style="margin: auto; max-width: 600px;">' +
                        '<p><strong>[TEST MODE]</strong> Experiment finished. ' +
                        'Redirect to Prolific suppressed.</p>' +
                        '<p>Open devtools and run: ' +
                        '<code>_inspectGuards()</code> or ' +
                        '<code>copy(jsPsych.data.get().csv())</code></p></div>');
                    console.log('%c[TEST MODE] on_finish complete; redirect suppressed.',
                        'background: #ffcc00; color: #000; padding: 2px 6px; font-weight: bold;');
                    return;
                }
                $('#jspsych-content').html('<div style="margin: auto;"> <p>' +
                    ' Thank you for participating in this experiment! </p>' +
                    '<p> Redirecting you back to Prolific... </p>');
                setTimeout(function(){}, 200);
                window.location = prolific_return_url;
            }
        });

        // ----- Debug inspector ----------------------------------------
        // Always available (not just in test mode) so a researcher can
        // open devtools mid-experiment and see what the guards have
        // accumulated. Reads through the public API of each module —
        // does not poke at internals.
        window._inspectGuards = function () {
            const friction = window.GuardFriction;
            const honeypot = window.GuardHoneypot;
            console.group('%c[Guards] inspect @ ' + new Date().toISOString(),
                'background: #1976d2; color: #fff; padding: 2px 6px; font-weight: bold;');

            if (friction) {
                console.log('Friction state:', friction.getCurrentState());
            } else {
                console.log('Friction: not loaded');
            }

            if (honeypot) {
                console.log('Honeypot bait fields:', honeypot.getHoneypotData());
                console.log('Violations (ended):', honeypot.getViolations());
                console.log('Per-trial snapshot (includes in-progress):',
                    honeypot.getTrialDataSnapshot());
            } else {
                console.log('Honeypot: not loaded');
            }

            // Recent trial rows: per-trial guard columns vs session columns.
            // Useful for verifying the rename fix landed correctly — per-trial
            // values vary row-to-row; session_* values are uniform across rows.
            const allRows = jsPsych.data.get().values();
            const lastFew = allRows.slice(-3);
            if (lastFew.length) {
                console.log('Last ' + lastFew.length + ' trial(s) — guard columns:');
                console.table(lastFew.map(function (r) {
                    return {
                        trial: r.trial,
                        ai_use: r.ai_use,
                        ai_use_session: r.ai_use_session,
                        violation_count: r.guard_assistance_violation_count,
                        violation_count_session: r.guard_assistance_violation_count_session,
                        in_violation: r.guard_assistance_in_violation,
                    };
                }));
            } else {
                console.log('No trial rows in jsPsych.data yet.');
            }
            console.groupEnd();
            return 'See expanded console group above.';
        };

        // Stories to include in the experiment.
        // Format: <competitive/complementary>-n_fruits(<nA>;<nO>)-R(<watched>;<not_watched>)_G(<watched>;<not_watched>)
        var selectedStories = [
            'competitive-n_fruits(1;1)-R(Orange;Apple)_G(Orange;Apple)',
            'competitive-n_fruits(1;1)-R(Apple;Orange)_G(Apple;Orange)',
            'competitive-n_fruits(1;1)-R(Orange;Apple)_G(Apple;Apple)',
            'competitive-n_fruits(1;1)-R(Orange;Apple)_G(Orange;Orange)',
            'competitive-n_fruits(1;1)-R(Apple;Orange)_G(Apple;Apple)',
            'competitive-n_fruits(1;1)-R(Apple;Orange)_G(Orange;Orange)',
            'competitive-n_fruits(1;1)-R(Orange;Apple)_G(Apple;Orange)',
            'competitive-n_fruits(1;1)-R(Apple;Apple)_G(Apple;Apple)',
            'competitive-n_fruits(1;1)-R(Orange;Orange)_G(Orange;Orange)',
            'competitive-n_fruits(1;1)-R(Orange;Orange)_G(Apple;Apple)',

            'complementary-n_fruits(1;1)-R(Orange;Orange)_G(Apple;Apple)',
            'complementary-n_fruits(1;1)-R(Orange;Apple)_G(Apple;Orange)',
            'complementary-n_fruits(1;1)-R(Apple;Orange)_G(Orange;Apple)',
        ];

        // Stories to use for comprehension checks (must be a subset of selectedStories)
        var comprehensionStoryIds = [
            'competitive-n_fruits(1;1)-R(Orange;Apple)_G(Apple;Orange)',
            'complementary-n_fruits(1;1)-R(Orange;Orange)_G(Apple;Apple)',
        ];

        // =============================================================
        // Build story objects from IDs
        // =============================================================

        var allStoryData = [];
        for (var i = 0; i < selectedStories.length; i++) {
            var story = storyIdToTimeline(selectedStories[i]);
            story.isComprehension = comprehensionStoryIds.indexOf(selectedStories[i]) !== -1;
            allStoryData.push(story);
        }
        console.log('All story data:', allStoryData);

    
        // =============================================================
        // Randomize story order and comprehension check order
        // =============================================================

        // Split into comprehension and trial stories

        var comprehensionStories = allStoryData.filter(function(s) { return s.isComprehension; });
        var trialStories = allStoryData; // all stories are trial stories
        // Randomize comprehension story order
        var compOrder = jsPsych.randomization.shuffle(Array.from({length: comprehensionStories.length}, (_, i) => i));
        // Randomize trial order
        var trialOrder = jsPsych.randomization.shuffle(Array.from({length: trialStories.length}, (_, i) => i));

        // Logic variables
        var comprehensionOngoing = !skipComprehension;
        var looping = false;
        var comprehensionTrialIdx = 0;
        var nComprehensionTrials = skipComprehension ? 0 : comprehensionStories.length;
        var trialIdx = 0;
        var nTrials = trialStories.length;
        var totalTrials = nComprehensionTrials + nTrials;

        // Per-participant: which character's row appears at the top of the grid.
        // Fixed for the whole session so the participant sees a consistent layout.
        var topCharacter = Math.random() < 0.5 ? 'red' : 'green';
        console.log('[layout] top_position:', topCharacter);

        // =============================================================
        // Helper: build the 5-scene grid HTML for a story
        // =============================================================
        function buildSceneGridHTML(story, options) {
            options = options || {};
            var highlightIdx = options.highlightIdx; // index to highlight (0-4), undefined = all visible
            var dim = options.dim; // if true, non-highlighted are dimmed
            var showDescs = options.showDescs; // if true, include description divs below each image

            var vignetteKeys = storyVignetteList(story);

            function descHTML(idx) {
                if (!showDescs) return '';
                var key = vignetteKeys[idx];
                var desc = scenes[key] ? scenes[key].description : '';
                return '<div class="scene-desc" data-desc-idx="' + idx + '">' + desc + '</div>';
            }

            // Per-character cell renderer. The data-scene-idx values stay
            // tied to the character (1/2 = red absent/present, 3/4 = green
            // absent/present) so reveal logic and saved data are unchanged
            // by row swapping. Only the top row carries the column headers
            // (keyed to fire when either row's image is revealed).
            function rowCells(character, withHeaders) {
                var absentIdx = character === 'red' ? 1 : 3;
                var presentIdx = character === 'red' ? 2 : 4;
                var absentHeader = withHeaders
                    ? '<div class="cell-header" data-header-for="1,3"><span style="color:purple; font-weight:bold">Purple</span> Absent</div>'
                    : '';
                var presentHeader = withHeaders
                    ? '<div class="cell-header" data-header-for="2,4"><span style="color:purple; font-weight:bold">Purple</span> Present</div>'
                    : '';
                var s = '';
                s += '<div class="row-label" style="color:' + character + ';"></div>';
                // Absent
                s += '<div class="scene-cell">';
                s += absentHeader;
                s += '<img src="./images/' + vignetteKeys[absentIdx] + '.png" class="scene-img' +
                    getImgClass(absentIdx, highlightIdx, dim) + '" data-scene-idx="' + absentIdx + '" />';
                s += descHTML(absentIdx);
                s += '</div>';
                // Present
                s += '<div class="scene-cell">';
                s += presentHeader;
                s += '<img src="./images/' + vignetteKeys[presentIdx] + '.png" class="scene-img' +
                    getImgClass(presentIdx, highlightIdx, dim) + '" data-scene-idx="' + presentIdx + '" />';
                s += descHTML(presentIdx);
                s += '</div>';
                return s;
            }

            var topChar = (typeof topCharacter !== 'undefined') ? topCharacter : 'red';
            var bottomChar = topChar === 'red' ? 'green' : 'red';

            var html = '<div class="scene-grid">';

            // Top row (carries the column headers)
            html += rowCells(topChar, true);

            // Preference cell (spans both rows visually via CSS grid-row: 1 / 3)
            // Inserted after the top row's cells so the grid picks it up in
            // column 2; CSS positions it across both rows.
            html += '<div class="pref-cell"><div class="scene-cell">';
            html += '<img src="./images/' + vignetteKeys[0] + '.png" class="scene-img' +
                getImgClass(0, highlightIdx, dim) + '" data-scene-idx="0" />';
            html += descHTML(0);
            html += '</div></div>';

            // Bottom row (no headers)
            html += rowCells(bottomChar, false);

            html += '</div>'; // scene-grid
            return html;
        }

        function getImgClass(idx, highlightIdx, dim) {
            if (highlightIdx === undefined) return ''; // all normal
            if (idx === highlightIdx) return ' highlighted';
            return dim ? ' dimmed' : '';
        }


        // =============================================================
        // Preload images
        // =============================================================
        var imagePaths = [
            './images/characters.png',
            './phaser/assets/characters/agent_red_happy.png',
            './phaser/assets/characters/agent_red.png',
            './phaser/assets/characters/agent_red_sad.png',
            './phaser/assets/characters/agent_green_happy.png',
            './phaser/assets/characters/agent_green.png',
            './phaser/assets/characters/agent_green_sad.png',
            './phaser/assets/characters/agent_purple_happy.png',
            './phaser/assets/characters/agent_purple.png',
            './phaser/assets/characters/agent_purple_sad.png',
            './phaser/assets/objects/applegreen1.png',
            './phaser/assets/objects/applegreen2.png',
            './phaser/assets/objects/orange1.png',
            './phaser/assets/objects/orange2.png',
            './phaser/assets/tilesets/blacksmith-smelter.png',
            './phaser/assets/tilesets/victorian-market.png',
            './phaser/assets/tilesets/victorian-streets.png',
            './phaser/assets/tilesets/victorian-garden.png',
            './phaser/assets/tilesets/terrain-v7.png',
            './phaser/assets/tilesets/tavern-deco.png',
            './phaser/assets/tilesets/tavern-furniture.png',
            './phaser/assets/tilesets/container.png',
        ];

        // Add all story images
        for (var i = 0; i < allStoryData.length; i++) {
            var vigs = storyVignetteList(allStoryData[i]);
            for (var j = 0; j < vigs.length; j++) {
                imagePaths.push('./images/' + vigs[j] + '.png');
            }
        }

        var preload_trial = {
            type: jsPsychPreload,
            images: imagePaths,
        };


        // =============================================================
        // Comprehension: helper to compute correct answers
        // =============================================================
        function getComprehensionAnswers(story) {
            var simParts = story.sim.split('_');
            var prefR = simParts[1].split('-')[1]; // 'A' or 'O'
            var prefG = simParts[2].split('-')[1]; // 'A' or 'O'

            var redAbsentChoice = story.redAbsent.split('_')[2].split('-')[1];
            var redPresentChoice = story.redPresent.split('_')[2].split('-')[1];
            var greenAbsentChoice = story.greenAbsent.split('_')[2].split('-')[1];
            var greenPresentChoice = story.greenPresent.split('_')[2].split('-')[1];

            return {
                redPref: (prefR === 'A') ? 'Apples' : 'Oranges',
                greenPref: (prefG === 'A') ? 'Apples' : 'Oranges',
                redGreenKnowPrefs: story.sim.includes('div') ? 'No' : 'Yes',
                purpleKnowsPrefs: story.sim.includes('P-present') ? 'Yes' : 'No',
                redPickedFavAbsent: (redAbsentChoice === prefR) ? 'Yes' : 'No',
                redPickedFavPresent: (redPresentChoice === prefR) ? 'Yes' : 'No',
                greenPickedFavAbsent: (greenAbsentChoice === prefG) ? 'Yes' : 'No',
                greenPickedFavPresent: (greenPresentChoice === prefG) ? 'Yes' : 'No',
            };
        }

        var comprehensionVideosSeen = false;

        // =============================================================
        // Comprehension: merged trial (videos + questions interleaved)
        // =============================================================

        // Helper: play a vignette video in the canvas container, call onDone when finished
        function playCompVideo(vignette, onDone) {
            if (window.game) { window.game.destroy(true); window.game = null; }
            var phaserParams = vignetteToPhaser(vignette);
            window.trialPhaserConfig = {
                framework: 'jspsych',
                endTrialCondition: 'callback',
                userId: 0,
                characterChoices: phaserParams.characterChoices,
                characterColors: phaserParams.characterColors,
                sceneStr: phaserParams.sceneStr,
                onComplete: function() {
                    if (onDone) onDone();
                },
            };
            window.vignetteStr = vignette;
            window.game = runPhaser(300, 300, 'comp-canvas');
        }

        var comp_merged_trial = {
            type: jsPsychHtmlButtonResponse,
            stimulus: function() {
                var story = jsPsych.timelineVariable('story');
                return '<div id="comp-outer-container">' +
                    '<div style="display:flex; align-items:flex-start; gap:20px; justify-content:center;">' +
                        '<div id="comp-grid-container">' + buildSceneGridHTML(story, { showDescs: true }) + '</div>' +
                        '<div id="comp-video-panel" style="display:flex; flex-direction:column; align-items:center; flex-shrink:0; min-width:320px;">' +
                            '<div id="comp-canvas" style="width:300px; height:300px; position:relative;"></div>' +
                            '<div id="comp-video-desc" style="text-align:center; font-size:15px; margin:10px 0; max-width:320px;"></div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            },
            choices: ['Submit'],
            on_load: function() {
                var story = jsPsych.timelineVariable('story');
                var vignetteKeys = storyVignetteList(story);
                var skipVideos = comprehensionVideosSeen;

                function colorSpan(name) {
                    var cap = name.charAt(0).toUpperCase() + name.slice(1);
                    return '<span style="color:' + name + '; font-weight:bold">' + cap + '</span>';
                }

                // Hide submit button initially
                var submitBtn = document.getElementById('jspsych-html-button-response-button-0');
                submitBtn.parentElement.style.display = 'none';

                // Hide video panel if skipping videos
                if (skipVideos) {
                    document.getElementById('comp-video-panel').style.display = 'none';
                }

                // All images, descriptions, and column headers start hidden
                var allImgs = document.querySelectorAll('.scene-img');
                var allDescs = document.querySelectorAll('.scene-desc');
                var allHeaders = document.querySelectorAll('.cell-header');
                allImgs.forEach(function(img) { img.style.opacity = '0'; });
                allDescs.forEach(function(desc) { desc.style.opacity = '0'; });

            on_finish: function(data) {

                               (resp.greenAbsent === answers.greenPickedFavAbsent) &&
                               (resp.greenPresent === answers.greenPickedFavPresent);

            type: jsPsychPipe,
            action: 'save',
            experiment_id: experiment_id,
            filename: fileID + '_trials.csv',
            on_finish: function(data) {
                console.log('[save_trial_data] success:', data.success, 'result:', data.result);
                if (!data.success) {
                    console.error('[save_trial_data] DataPipe rejected the trials file. Filename:',
                        fileID + '_trials.csv', 'Response:', data.result);
                }
                // Fallback: if running with placeholder experiment_id, save the
                // exact CSV body the data_string callback just built (stashed
                // on window._lastTrialsCsv) to a local file. Produces an
                // identical file to what DataPipe would have stored.
                if (_USING_PLACEHOLDER_DATAPIPE_ID && window._lastTrialsCsv) {
                    var _b = new Blob([window._lastTrialsCsv], { type: 'text/csv' });
                    var _a = document.createElement('a');
                    _a.href = URL.createObjectURL(_b);
                    _a.download = fileID + '_trials.csv';
                    document.body.appendChild(_a);
                    _a.click();
                    document.body.removeChild(_a);
                }
            },
            data_string: function() {
                // Drain guards BEFORE building the CSV so in-progress
                // violations get a proper 'end' event in the log.
                // finalize() is idempotent: friction.stop() requires a
                // valid token and silently rejects subsequent calls, and
                // honeypot.attachToJsPsychData() can be called repeatedly
                // (each call overwrites the session columns with the same
                // values). The experiment-level on_finish will re-call
                // both, which is a no-op here.
                jsPsych.extensions['guard-friction'].finalize();
                jsPsych.extensions['guard-honeypot'].finalize();
                var matched = jsPsych.data.get().filter({ trial: 'trial' }).values();
                console.log('[save_trial_data] matched trial records:', matched.length);
                var data = matched;
                var rows = data.map(function(t) {
                    // All string fields go through csvQuote — protects against
                    // commas/newlines in URL-derived IDs, vignette identifiers
                    // (which contain '(', ';', ')' chars), and free-text
                    // explanations. Numeric/boolean fields stay raw.
                    return [
                        csvQuote(unique_id),
                        csvQuote(prolific_id),
                        csvQuote(t.trial_type),
                        t.trial_idx,
                        csvQuote(t.story_id),
                        csvQuote(t.first),
                        csvQuote(t.top_position),
                        csvQuote(t.vignette_sim),
                        csvQuote(t.vignette_red_absent),
                        csvQuote(t.vignette_red_present),
                        csvQuote(t.vignette_green_absent),
                        csvQuote(t.vignette_green_present),
                        t.rt,
                        t.time_elapsed,
                        csvQuote(t.red_likes),
                        csvQuote(t.red_cares),
                        csvQuote(t.green_likes),
                        csvQuote(t.green_cares),
                        t.red_x,
                        t.red_y,
                        t.green_x,
                        t.green_y,
                        t.purple_x,
                        t.purple_y,
                        t.guard_assistance_active ? 1 : 0,
                        t.guard_assistance_in_violation ? 1 : 0,
                        t.guard_assistance_violation_count || 0,
                        csvQuote(t.guard_assistance_current_reason || ''),
                        csvQuote(t.explanation || ''),
                    ].join(',');
                });
                var header = [
                    'id', 'prolific_id', 'trial_type', 'trial_idx', 'story_id', 'first', 'top_position',
                    'vignette_sim', 'vignette_red_absent', 'vignette_red_present',
                    'vignette_green_absent', 'vignette_green_present',
                    'rt', 'time_elapsed',
                    'red_likes', 'red_cares', 'green_likes', 'green_cares',
                    'red_x', 'red_y', 'green_x', 'green_y', 'purple_x', 'purple_y',
                    'guard_assistance_active', 'guard_assistance_in_violation',
                    'guard_assistance_violation_count', 'guard_assistance_current_reason',
                    'explanation',
                ].join(',');
                var csv = [header].concat(rows).join('\n');
                console.log('[save_trial_data] CSV length:', csv.length, 'bytes');
                console.log('[save_trial_data] CSV body:\n' + csv);
                // Stash for the placeholder-mode local download fallback (see on_finish above).
                window._lastTrialsCsv = csv;
                return csv;
            }
        };

        var save_participant_data = {
            type: jsPsychPipe,
            action: 'save',
            experiment_id: experiment_id,
            filename: fileID + '_participant.csv',
            on_finish: function(data) {
                console.log('[save_participant_data] success:', data.success, 'result:', data.result);
                if (!data.success) {
                    console.error('[save_participant_data] DataPipe rejected the participant file. Filename:',
                        fileID + '_participant.csv', 'Response:', data.result);
                }
                // Fallback: if running with placeholder experiment_id, save the
                // exact participant CSV body to a local file. See save_trial_data
                // for the symmetric pattern.
                if (_USING_PLACEHOLDER_DATAPIPE_ID && window._lastParticipantCsv) {
                    var _b = new Blob([window._lastParticipantCsv], { type: 'text/csv' });
                    var _a = document.createElement('a');
                    _a.href = URL.createObjectURL(_b);
                    _a.download = fileID + '_participant.csv';
                    document.body.appendChild(_a);
                    _a.click();
                    document.body.removeChild(_a);
                }
            },
            data_string: function() {
                // Idempotent guard drain — friction was already stopped
                // by save_trial_data; this call is for the case where
                // save_participant_data runs without save_trial_data
                // preceding it. honeypot.attachToJsPsychData() re-runs
                // safely and updates the session columns with the latest
                // values (will include any bait events fired after the
                // previous save).
                jsPsych.extensions['guard-friction'].finalize();
                jsPsych.extensions['guard-honeypot'].finalize();
                var time = TimeMe.getTimeOnPageInSeconds('page');
                var data = jsPsych.data.get().filter({ trial_type: 'survey-html-form', trial: 'demographics' }).values()[0];
                var resp = data ? data.response : {};

                var hp = GuardHoneypot.getHoneypotData();

                // All string fields go through csvQuote — same rationale as
                // save_trial_data's rows.map. URL-derived prolific_*
                // identifiers and free-text feedback in particular could
                // contain commas or newlines that would corrupt the CSV.
                var participant = [
                    csvQuote(unique_id),
                    csvQuote(prolific_id),
                    csvQuote(prolific_study_id || ''),
                    csvQuote(prolific_session_id || ''),
                    csvQuote('demographics'),
                    csvQuote(resp.feedback || ''),
                    resp.age || '',
                    csvQuote(resp.gender || ''),
                    csvQuote(resp.race || ''),
                    csvQuote(resp.ethnicity || ''),
                    time,
                    hp.ai_use,
                    csvQuote(hp.ai_report || ''),
                ].join(',');
                var header = 'id,prolific_id,study_id,session_id,trial_type,feedback,age,gender,race,ethnicity,time,ai_use,ai_report';
                var csv = header + '\n' + participant;
                // Stash for the placeholder-mode local download fallback (see on_finish above).
                window._lastParticipantCsv = csv;
                return csv;
            }
        };


        // Final screen
        var final_screen = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="max-width:600px; margin:auto; text-align:center;">' +
                '<h2>Thank you!</h2>' +
                '<p>You have completed the study. Your responses have been recorded.</p>' +
                '<p><a href="' + prolific_return_url + '">Click here to go back to Prolific</a></p>' +
                '</div>',
            choices: 'NO_KEYS',
            response_ends_trial: false,
            trial_duration: 250
        };


        // =============================================================
        // Compile timeline
        // =============================================================
        var timeline = [];
        timeline.push(preload_trial);
        timeline.push(consent);
        // Skip the entry trial in observe mode — it would request fullscreen
        // and block agents that can't enter it. Friction monitoring still
        // happens (started from the extension's initialize()), just silently.
        if (!debugMode && !observeMode) {
            timeline.push(jsPsychGuardFriction.entryTrial());
        }
        if (!skipComprehension) {
            timeline.push(comprehension_instructions_trial);
            for (var cl = 0; cl < comprehension_loops.length; cl++) {
                timeline.push(comprehension_loops[cl]);
            }
        }

        timeline.push(trial_instructions_trial);
        for (var ti = 0; ti < trials.length; ti++) {
            timeline.push(trials[ti]);
        }
        timeline.push(feedback_demographics);
        timeline.push(save_trial_data);
        timeline.push(save_participant_data);
        timeline.push(final_screen);

        // Opt every trial in to all three extensions. cyborg-hunter
        // collects per-trial integrity signals; the guard extensions wire
        // their lifecycle hooks (per-trial honeypot snapshot from the
        // honeypot extension; no-ops from friction).
        timeline.forEach(function (t) {
            t.extensions = (t.extensions || []).concat([
                { type: jsPsychCyborgHunter },
                { type: jsPsychGuardFriction },
                { type: jsPsychGuardHoneypot }
            ]);
        });

        // =============================================================
        // Run
        // =============================================================
        jsPsych.run(timeline);

    </script>

</html>
